{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Дом и быт{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shop/shop.css' %}">
</head>
<body>
    <header class="header">
        <div class="wrap header-content">
            <a class="brand" href="{% url 'index' %}">Дом и быт</a>
            <nav aria-label="Главное меню">
                {% if user.is_authenticated %}
                    <a href="{% url 'account' %}">Мои покупки</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="quiet" type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
